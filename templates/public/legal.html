{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
{% include "public/includes/head_common.html" %}
<title>{{ title }} | EGUP</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="EGUP">
<meta property="og:title" content="{{ title }} | EGUP">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include "public/includes/header.html" %}
<main id="main" class="main--header-offset">
  <section class="section">
    <div class="container-narrow">
      <h1 class="section-title">{{ title }}</h1>
      <div class="prose">{{ body|default:"Content coming soon."|linebreaks }}</div>
    </div>
  </section>
</main>
{% include "public/includes/footer.html" %}
<script>document.querySelectorAll('[data-current-year]').forEach(function(el){el.textContent = new Date().getFullYear();});</script>
<script type="module" src="{% static 'js/main.js' %}"></script>
</body>
</html>
